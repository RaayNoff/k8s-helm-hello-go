{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "httpserver.fullname" .}}
  labels:
    {{- include "httpserver.labels" . | nindent 4}}
spec:
  ingressClassName: nginx
  rules:
    - host: {{.Values.ingress.host}}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "httpserver.fullname" . }}
                port:
                  number: {{ .Values.service.port}}
{{ end }}