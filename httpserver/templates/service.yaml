apiVersion: v1
kind: Service
metadata:
  name: {{ include "httpserver.fullname" .}}
  labels:
    {{- include "httpserver.labels" . | nindent 4}}
spec:
  type: {{.Values.service.type}}
  selector:
    {{- include "httpserver.selectorLabels" . | nindent 4}}
  ports:
    - protocol: TCP
      name: http
      targetPort: http
      port: {{.Values.service.port}}
